name: Publish PlatformIO package

on:
  push:
    tags:
      - "musical-clock-v*"

permissions:
  contents: read

env:
  PLATFORMIO_CORE_DIR: .platformio-home

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Validate package version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#musical-clock-v}"
          manifest_version="$(python -c 'import json; print(json.load(open("packages/musical-clock/library.json", encoding="utf-8"))["version"])')"

          if [[ "$tag" == "$version" || "$tag" != musical-clock-v* ]]; then
            echo "Unsupported package tag: $tag" >&2
            exit 2
          fi
          if [[ "$version" != "$manifest_version" ]]; then
            echo "Tag version '$version' does not match manifest version '$manifest_version'." >&2
            exit 1
          fi

      - name: Run native package tests
        run: pio test -d packages/musical-clock -e native

      - name: Pack package
        run: pio pkg pack packages/musical-clock --output /tmp

      - name: Publish package to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORMIO_AUTH_TOKEN:-}" ]]; then
            echo "PLATFORMIO_AUTH_TOKEN secret is required." >&2
            exit 1
          fi
          pio pkg publish packages/musical-clock --type library --no-interactive
